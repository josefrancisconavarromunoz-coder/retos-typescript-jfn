<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript ES6+ - Ejercicios</title>
</head>
<body>

  <main class="container">
    <h1>JavaScript Moderno ES6+</h1>

    <section>
      <h2>Ejercicio 1: Filtro de productos</h2>
      <div id="resultado-filtro"></div>
    </section>

    <section>
      <h2>Ejercicio 2: Carrito</h2>
      <div id="resultado-carrito"></div>
    </section>

    <section>
      <h2>Ejercicio 3: Posts por usuario</h2>
      <div id="resultado-usuario"></div>
    </section>

    <section>
      <h2>Ejercicio 4: Usuarios</h2>
      <div id="contenedor-usuarios"></div>
    </section>

    <section>
      <h2>Ejercicio 5: Buscador de posts</h2>
      <input type="number" id="input-post" placeholder="ID del post">
      <button id="btn-buscar">Buscar</button>
      <div id="resultado-busqueda"></div>
    </section>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
